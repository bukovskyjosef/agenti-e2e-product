name: agenti / E2E sandbox setup

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deterministic E2E mode
        env:
          AGENTI_TEST_MODE: ${{ vars.AGENTI_TEST_MODE }}
        run: |
          test "$AGENTI_TEST_MODE" = "true"
          echo "AGENTI_TEST_MODE=true"
      - name: Ensure durable state labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "agenti:managed" --repo "$REPO" --force --color "1d76db" --description "Agenti durable state projection"
          gh label create "agenti:waiting-human" --repo "$REPO" --force --color "fbca04" --description "Agenti durable state projection"
          gh label create "agenti:release-approval" --repo "$REPO" --force --color "d93f0b" --description "Agenti durable state projection"
          gh label create "agenti:blocked" --repo "$REPO" --force --color "b60205" --description "Agenti durable state projection"
          gh label create "agenti:stopped" --repo "$REPO" --force --color "5319e7" --description "Agenti durable state projection"
          gh label create "agenti:done" --repo "$REPO" --force --color "0e8a16" --description "Agenti durable state projection"
          echo "E2E sandbox labels: OK"
